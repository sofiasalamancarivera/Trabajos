<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destino Turistico</title>
</head>
<body>
    <a href="https://www.civitatis.com/blog/que-ver-seul/?srsltid=AYCX9vKRJgh3IxznQzRz0RkCQQzPxC7J-H04oF_YBmjYB0kONVStI-te" target="_blank" rel="">
        Sitio Que puedes hacer en corea
    </a>
    <img src="torregamnan.jpg" alt="Destino">
    <ul>
        <li>Recorrido</li>
        <li>Fotos</li>
        <li>Almuerzo</li>
    </ul>
    <ol>
        <li>Agendar cita</li>
        <li>Llegar al punto de encuentro</li>
        <li>Realizar las actividades</li>
    </ol>
<form action="/registro">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
    <label for="correo">Correo:</label>
    <input type="text" id="correo" name="correo" required>
    <label for="nacimiento">Fecha Nacimiento:</label>
    <input type="text" id="nacimiento" name="nacimiento" required>
    <label for="programa">Programa:</label>
    <select name="programa" id="programa">
        <option value="select">Selecciona</option>
        <option value="ADSO">ADSO</option>
        <option value="CNC">CNC</option>
    </select>
    
    <fieldset>
        <legend>Modalidad</legend>
    <label for="modalidad">Virtual</label>
    <input type="radio" id="virtual" name="virtual" required>
    <label for="modalidad">Presencial</label>
    <input type="radio" id="virtual" name="virtual" required>
    <label for="modalidad">Mixto</label>
    <input type="radio" id="virtual" name="virtual" required>
    </fieldset>

    <div>
      <input type="checkbox" id="terminos" name="terminos" required>
      <label for="terminos">Acepto los términos y condiciones</label>
    </div>

    <div>
      <button type="submit">Enviar inscripción</button>
    </div>
</form>
</body>
</html>
